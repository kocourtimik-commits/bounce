let actx = null;
function beep(f1, f2, dur = 0.12, vol = 0.05) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f1, actx.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e) {}
}

let done = new Set();

let bestDeaths = {};

let speedrunAttempts = 0;
let cheatAirJump = false;
let bestEndlessDistance = 0;

function saveProgress() {
  try {
    localStorage.setItem('splitted_v22', JSON.stringify({
      done: [...done], bestTimes, bestDeaths, totalDeaths, bestSpeedrun, speedrunAttempts, cheatAirJump, bestEndlessDistance
    }));
  } catch(e) {}
}
function loadProgress() {
  try {
    const raw = localStorage.getItem('splitted_v22') || localStorage.getItem('bounceback_v22') || localStorage.getItem('bounceback_v21');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.done) done = new Set([...d.done].filter(i => i < LEVELS.length));
    if (d.bestTimes) bestTimes = d.bestTimes;
    if (d.bestDeaths) bestDeaths = d.bestDeaths;
    if (d.totalDeaths) totalDeaths = d.totalDeaths;
    if (d.bestSpeedrun) bestSpeedrun = d.bestSpeedrun;
    if (d.speedrunAttempts) speedrunAttempts = d.speedrunAttempts;
    if (d.cheatAirJump) cheatAirJump = true;
    if (d.bestEndlessDistance) bestEndlessDistance = d.bestEndlessDistance;
  } catch(e) {}
}

function getMenuItems() {
  const items = ['PLAY', 'LEVELS', 'ENDLESS (beta)', 'CONTROLS'];
  if (done.size === LEVELS.length) items.push('SPEEDRUN', 'CHEATS');
  return items;
}
function nextUndone() {
  for (let i = 0; i < LEVELS.length; i++) if (!done.has(i)) return i;
  return 0;
}

function openMenu() { screen = 'MENU'; menuIndex = 0; cheatsHelpTimer = 0; lostParts.clear(); }
function openLevels() { screen = 'LEVELS'; levelHoverIdx = nextUndone(); }
function openControls() { screen = 'CONTROLS'; }
function openSpeedrunMenu() { screen = 'SPEEDRUN_MENU'; }
function openCheats() { screen = 'CHEATS'; cheatsIndex = 0; cheatsHelpTimer = 0; }

function startSpeedrun() {

  speedrunElapsed = 0;
  speedrunAttempts++;

function startEndless() {

  endless.chunks = [];
  endless.nextChunkX = 100;
  endless.cameraX = -150;
  endless.distance = 0;
  endless.runTime = 0;

    vx: 0, vy: 0, grounded: false, coyote: 0,

  shakeAmount = 0;

}

function loadLevel(i) {
  if (i >= LEVELS.length) {
    if (speedrunMode) {
      speedrunTotalTime = speedrunElapsed;
      if (!bestSpeedrun || speedrunTotalTime < bestSpeedrun) bestSpeedrun = speedrunTotalTime;
      speedrunMode = false;
      screen = 'SPEEDRUN_DONE';
      saveProgress();
      return;
    }
    openMenu();
    return;
  }
  screen = 'GAME';
  lvlIdx = i;
  lvl = JSON.parse(JSON.stringify(LEVELS[i]));
  lostParts.clear();
  resetPlayerToSpawn();
  introFrames = INTRO_TOTAL;
  completeFrames = 0;
  completeNewBest = false;
  lvlTime = 0;
  lvlDeaths = 0;
  shakeAmount = 0;
  acc = 0;
}
function resetPlayerToSpawn() {
  lostParts.clear();
  Object.assign(player, {
    x: lvl.spawn.x, y: lvl.spawn.y, px: lvl.spawn.x, py: lvl.spawn.y,
    vx: 0, vy: 0, grounded: false, coyote: 0, state: 'ASSEMBLED', scaleX: 1, scaleY: 1

}

  const px = player.x + player.w/2;
  const py = player.y + player.h/2;

  totalDeaths++;
  shakeAmount = 10;
  beep(150, 60, 0.3);
  saveProgress();
  resetPlayerToSpawn();
  addDust(px, py, 20);
}
function restartLevel() {
  lvl = JSON.parse(JSON.stringify(LEVELS[lvlIdx]));

  resetPlayerToSpawn();
  lvlTime = 0;
  introFrames = INTRO_TOTAL;
}

function solids() {
  const s = [...lvl.walls];
  lvl.doors.forEach(d => s.push({ x: d.x, y: d.currY, w: d.w, h: d.h }));
  lvl.breakableWalls.forEach(w => { if (!w.broken) s.push({ x: w.x, y: w.y, w: w.w, h: w.h }); });
  return s;
}
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function addDust(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.2;
    dust.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-0.5, life: 1, s: 3+Math.random()*2 });
  }
}

function pushOutOfSolids(p, sol) {
  for (let iter = 0; iter < 4; iter++) {
    let moved = false;
    for (let s of sol) {
      if (hit(p, s)) {
        const oT = (p.y + p.h) - s.y;
        const oB = (s.y + s.h) - p.y;
        const oL = (p.x + p.w) - s.x;
        const oR = (s.x + s.w) - p.x;
        const m = Math.min(oT, oB, oL, oR);
        if (m === oT) { p.y = s.y - p.h; if (p.vy > 0) p.vy = 0; }
        else if (m === oB) { p.y = s.y + s.h; if (p.vy < 0) p.vy = 0; }
        else if (m === oL) { p.x = s.x - p.w; if (p.vx > 0) p.vx = 0; }
        else { p.x = s.x + s.w; if (p.vx < 0) p.vx = 0; }
        moved = true;
      }
    }
    if (!moved) break;
  }
}

function pickDefaultAnchor() {
  if (!pieces.length) return;
  let best = pieces[0];
  pieces.forEach(p => { if (player.facing >= 0 ? p.x > best.x : p.x < best.x) best = p; });
  anchorId = best.id;
}

function shatter() {
  if (player.state !== 'ASSEMBLED') return;
  player.state = 'SHATTERED';
  beep(220, 90, 0.14);
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  const boostVx = (screen === 'ENDLESS')
    ? Math.max(0, player.vx * 1.2) + player.facing * 5.5
    : (player.vx * 1.5 + player.facing * 2.5);
  pieces = [];
  PARTS.forEach((p, i) => {
    if (lostParts.has(i)) return;
    const x = cx + p.ox - p.w/2, y = cy + p.oy - p.h/2;
    pieces.push({
      id: i, x, y, px: x, py: y,
      w: p.w, h: p.h, ox: p.ox, oy: p.oy, head: !!p.head,
      vx: boostVx + p.ox*0.14 + (Math.random()-0.5)*0.8,
      vy: player.vy*0.85 + p.oy*0.04 - 1.2,
      rot: 0, vrot: (Math.random()-0.5)*0.1,
      dead: false, deathCause: null
    });
  });
  const spawnSol = (screen === 'ENDLESS') ? endlessSolids() : solids();
  pieces.forEach(p => pushOutOfSolids(p, spawnSol));
  pickDefaultAnchor();
  addDust(cx, cy, 10);
}

const OFFSETS = (() => {
  const a = [];
  for (let dy = -120; dy <= 120; dy += 2) for (let dx = -120; dx <= 120; dx += 2) a.push([dx, dy, dx*dx + dy*dy]);
  a.sort((p, q) => p[2] - q[2]);
  return a;
})();
function findFree(tx, ty) {
  const sol = solids();
  for (const [dx, dy] of OFFSETS) {
    const x = Math.max(16, Math.min(tx + dx, 864 - player.w));
    const y = Math.max(16, Math.min(ty + dy, 460 - player.h));
    const box = { x, y, w: player.w, h: player.h };
    let ok = true;
    for (const s of sol) if (hit(box, s)) { ok = false; break; }
    if (ok) return [x, y];
  }
  return [tx, ty];
}
function findFreeEndless(tx, ty) {
  const sol = endlessSolids();
  for (const [dx, dy] of OFFSETS) {
    const x = Math.max(-1000, Math.min(tx + dx, 100000));
    const y = Math.max(16, Math.min(ty + dy, 460 - player.h));
    const box = { x, y, w: player.w, h: player.h };
    let ok = true;
    for (const s of sol) if (hit(box, s)) { ok = false; break; }
    if (ok) return [x, y];
  }
  return [tx, ty];
}

function reassemble() {
  if (player.state !== 'SHATTERED' || !pieces.length) return;
  const a = pieces.find(p => p.id === anchorId) || pieces[0];
  const acx = a.x + a.w/2, acy = a.y + a.h/2;
  const [tx, ty] = (screen === 'ENDLESS')
    ? findFreeEndless(acx - a.ox - player.w/2, acy - a.oy - player.h/2 - 2)
    : findFree(acx - a.ox - player.w/2, acy - a.oy - player.h/2 - 2);
  player.tx = tx; player.ty = ty;
  player.state = 'REASSEMBLING'; player.timer = 0;
  pieces.forEach(p => { p.sx = p.x; p.sy = p.y; });
  beep(280, 560, 0.16);
  addDust(acx, acy, 10);
}

function activateMenuSelection(idx) {
  beep(360, 520, 0.1);
  const sel = getMenuItems()[idx];
  if (sel === 'PLAY') loadLevel(nextUndone());
  else if (sel === 'LEVELS') openLevels();
  else if (sel === 'ENDLESS (beta)') startEndless();
  else if (sel === 'CONTROLS') openControls();
  else if (sel === 'SPEEDRUN') openSpeedrunMenu();
  else if (sel === 'CHEATS') openCheats();
}

function endlessSolids() {
  const s = [];
  for (const c of endless.chunks) for (const w of c.walls) s.push(w);
  return s;
}

function makeEndlessChunk(idx, x) {
  const diff = Math.min(4, Math.floor(idx / 4));
  const walls = [];
  const hazards = [];

  if (idx < 2) {
    walls.push(B(x, 390, 400, 70));
    return { startX: x, width: 400, walls, hazards };
  }

  const types = ['flat', 'hurdles', 'gap', 'low_ceiling', 'spike_pit'];
  let type;
  const r = Math.random();
  if (idx < 4) type = r < 0.55 ? 'flat' : 'hurdles';
  else if (idx < 8) type = r < 0.2 ? 'flat' : r < 0.45 ? 'hurdles' : r < 0.7 ? 'gap' : 'low_ceiling';
  else type = types[Math.floor(Math.random() * types.length)];

  let width = 400;
  switch (type) {
    case 'flat':
      width = 260 + Math.random() * 60;
      walls.push(B(x, 390, width, 70));
      break;
    case 'hurdles': {
      width = 380 + diff * 30;
      walls.push(B(x, 390, width, 70));
      const n = 2 + Math.min(2, diff);
      const spacing = width / (n + 1);
      for (let i = 0; i < n; i++) {
        const sx = x + spacing * (i + 1) - 22;
        hazards.push({ x: sx, y: 372, w: 44, h: 18 });
      }
      break;
    }
    case 'gap': {
      const gw = 80 + diff * 15;
      const leftW = 110;
      const midW = 80;
      const rightW = 100 + diff * 20;
      width = leftW + gw + midW + gw + rightW;
      walls.push(B(x, 390, leftW, 70));
      walls.push(B(x + leftW + gw, 390, midW, 70));
      walls.push(B(x + leftW + gw + midW + gw, 390, rightW, 70));
      hazards.push(PIT(x + leftW, gw));
      hazards.push(PIT(x + leftW + gw + midW, gw));
      break;
    }
    case 'low_ceiling': {
      width = 360 + diff * 30;
      walls.push(B(x, 390, width, 70));
      const ceilW = 160 + diff * 25;
      walls.push(B(x + (width - ceilW) / 2, 0, ceilW, 340));
      break;
    }
    case 'spike_pit': {
      const pitW = 90 + diff * 20;
      const leftW = 100 + Math.random() * 60;
      const rightW = 100 + Math.random() * 60;
      width = leftW + pitW + rightW;
      walls.push(B(x, 390, leftW, 70));
      walls.push(B(x + leftW + pitW, 390, rightW, 70));
      hazards.push(PIT(x + leftW, pitW));
      break;
    }
  }
  return { startX: x, width, walls, hazards };
}

      const by = f => pieces.reduce((a, p) => f(p) > f(a) ? p : a);
      let pick = null;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') pick = by(p => p.x);
      else if (e.code === 'KeyA' || e.code === 'ArrowLeft') pick = by(p => -p.x);

      if (pick) { anchorId = pick.id; beep(480, 580, 0.06, 0.04); }

    if (e.code === 'KeyR' && screen === 'GAME') restartLevel();
  }
  keys[e.code] = true;
});

function mousePos(e) {

}

function updateGame() {
  player.px = player.x; player.py = player.y;
  pieces.forEach(p => { p.px = p.x; p.py = p.y; });

  if (introFrames > 0) introFrames--;

  if (completeFrames > 0) {
    completeFrames--;
    if (completeFrames === 0) loadLevel(lvlIdx + 1);
    return;
  }

  lvlTime += STEP / 1000;

  lvl.buttons.forEach(b => {
    let active = false;
    if (player.state === 'ASSEMBLED' && hit(player, b)) active = true;
    if (!active && player.state !== 'ASSEMBLED') {
      for (let p of pieces) if (!p.dead && hit(p, b)) { active = true; break; }
    }
    if (b.duration) {
      if (b.timer > 0) {
        b.timer--;
        if (b.timer === 0) b.pressed = false;
      }
      if (active) {
        if (!b.pressed) beep(360, 520, 0.1, 0.05);
        b.pressed = true;
        b.timer = b.duration;
      }
    } else if (!b.pressed && active) {
      b.pressed = true; beep(360, 520, 0.1, 0.05);
    }
  });

  lvl.doors.forEach(d => {
    const b = lvl.buttons.find(btn => btn.id === d.id);
    const target = (b && b.pressed) ? d.openY : d.y;
    d.currY += (target - d.currY) * 0.14;
    if (Math.abs(target - d.currY) < 0.3) d.currY = target;
  });

  lvl.springs.forEach(s => { if (s.sq > 0) s.sq--; });

  player.scaleX += (1-player.scaleX)*0.18;
  player.scaleY += (1-player.scaleY)*0.18;

  const hasLegL = !lostParts.has(5);
  const hasLegR = !lostParts.has(6);
  const bothLegsGone = !hasLegL && !hasLegR;
  const oneLegOnly = hasLegL !== hasLegR;

  if (player.state === 'ASSEMBLED') {
    const sol = solids();
    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];

    let effSpeed = player.speed;
    let effJump = player.jump;
    if (oneLegOnly) {
      effSpeed *= 0.65;
      effJump *= 0.85;
    } else if (bothLegsGone) {
      effSpeed *= 0.5;
    }

    const targetVx = left ? -effSpeed : right ? effSpeed : 0;
    player.vx += (targetVx - player.vx) * 0.25;
    if (Math.abs(player.vx) > 0.3) {
      player.facing = player.vx > 0 ? 1 : -1;
      if (player.grounded) player.walk += Math.abs(player.vx) * 0.06;
    } else player.walk = 0;

    if (player.grounded) player.coyote = 8;
    else if (player.coyote > 0) player.coyote--;

    if ((keys['Space']||keys['ArrowUp']||keys['KeyW']) && player.coyote > 0) {
      player.vy = effJump; player.grounded = false; player.coyote = 0;
      player.scaleX = 0.82; player.scaleY = 1.22;
      beep(240, 420, 0.1);
      addDust(player.x + player.w/2, player.y + player.h, 5);
    }
    else if (bothLegsGone && player.grounded) {
      player.vy = -5;
      player.grounded = false;
      player.scaleX = 0.9; player.scaleY = 1.15;
      beep(180, 320, 0.08, 0.03);
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    for (let s of sol) {
      if (hit(player, s)) {
        if (player.vx > 0) player.x = s.x - player.w;
        else if (player.vx < 0) player.x = s.x + s.w;
        player.vx = 0;
      }
    }
    const wasG = player.grounded;
    player.y += player.vy;
    player.grounded = false;
    for (let s of sol) {
      if (hit(player, s)) {
        if (player.vy > 0) {
          if (!wasG && player.vy > 3) {
            player.scaleX = 1.2; player.scaleY = 0.82;
            addDust(player.x+player.w/2, s.y, 4);
          }
          player.y = s.y - player.h; player.vy = 0; player.grounded = true;
        } else if (player.vy < 0) {
          player.y = s.y + s.h; player.vy = 0;
        }
      }
    }

    lvl.springs.forEach(s => {
      if (player.vy >= 0 && hit(player, s)) {
        player.vy = -s.power; player.grounded = false; player.coyote = 0;
        player.scaleX = 0.78; player.scaleY = 1.28;
        s.sq = 8;
        beep(300, 720, 0.16, 0.06);
        addDust(player.x + player.w/2, s.y, 6);
      }
    });

    let inWind = false;
    lvl.windZones.forEach(wz => {
      if (hit(player, wz)) { player.vx += wz.ax; player.vy += wz.ay; inWind = true; }
    });
    if (inWind && player.vy < -5.2) player.vy = -5.2;

    if (player.y > 460 || player.y < -100 || player.x < -50 || player.x > 930) { die(); return; }

    for (let h of lvl.hazards) {
      if (hit(player, h)) { die(); return; }
    }
    if (hit(player, lvl.goal)) {
      const isNew = !bestTimes[lvlIdx] || lvlTime < bestTimes[lvlIdx];
      done.add(lvlIdx);
      if (isNew) bestTimes[lvlIdx] = lvlTime;
      if (bestDeaths[lvlIdx] === undefined || lvlDeaths < bestDeaths[lvlIdx]) bestDeaths[lvlIdx] = lvlDeaths;
      saveProgress();
      beep(440, 660, 0.14);
      completeNewBest = isNew && !speedrunMode;
      completeFrames = COMPLETE_TOTAL;
      return;
    }
  }
  else if (player.state === 'SHATTERED') {
    lvl.breakableWalls.forEach(w => {
      if (w.broken) return;
      for (let p of pieces) {
        if (p.dead) continue;
        if (Math.hypot(p.vx, p.vy) > 2) {
          const test = { x: p.x + p.vx, y: p.y + p.vy, w: p.w, h: p.h };
          if (hit(test, w)) {
            w.broken = true;
            addDust(w.x + w.w/2, w.y + w.h/2, 25);
            shakeAmount = 6;
            beep(140, 60, 0.2);
            break;
          }
        }
      }
    });

    const sol = solids();

    pieces.forEach(p => {
      if (p.dead) return;
      p.vy += GRAVITY;
      p.x += p.vx;
      for (let s of sol) {
        if (hit(p, s)) {
          if (p.vx > 0) p.x = s.x - p.w;
          else if (p.vx < 0) p.x = s.x + s.w;
          p.vx = -p.vx * 0.35;
        }
      }
      p.y += p.vy;
      for (let s of sol) {
        if (hit(p, s)) {
          if (p.vy > 0) {
            p.y = s.y - p.h; p.vy = -p.vy * 0.22;
            p.vx *= 0.91; p.vrot *= 0.6;
            if (Math.abs(p.vy) < 0.5) p.vy = 0;
          } else if (p.vy < 0) {
            p.y = s.y + s.h; p.vy = 0;
          }
        }
      }
      let inWind = false;
      lvl.windZones.forEach(wz => {
        if (hit(p, wz)) { p.vx += wz.ax; p.vy += wz.ay; inWind = true; }
      });
      if (inWind && p.vy < -6) p.vy = -6;
      for (let h of lvl.hazards) {
        if (hit(p, h)) { p.dead = true; p.deathCause = 'hazard'; break; }
      }
      if (p.y > 500 || p.x < -50 || p.x > 930) {
        p.dead = true;
        if (!p.deathCause) p.deathCause = 'oob';
      }
      p.rot += p.vrot;
    });
    pieces.forEach(p => { if (p.dead && p.deathCause === 'hazard') lostParts.add(p.id); });
    pieces = pieces.filter(p => !p.dead);
    if (pieces.length === 0) { die(); return; }
    if (!pieces.some(p => p.id === anchorId)) pickDefaultAnchor();
  }
  else if (player.state === 'REASSEMBLING') {
    player.timer += 0.09;
    const t = Math.min(player.timer, 1);
    const ease = 1 - Math.pow(1-t, 3);
    pieces.forEach(p => {
      const dx = player.tx + player.w/2 + p.ox - p.w/2;
      const dy = player.ty + player.h/2 + p.oy - p.h/2;
      p.x = p.sx + (dx - p.sx) * ease;
      p.y = p.sy + (dy - p.sy) * ease;
      p.rot *= (1-t);
    });
    if (t >= 1) {
      player.x = player.tx; player.y = player.ty;
      player.px = player.x; player.py = player.y;
      if (cheatAirJump || lvlIdx === 6 || lvlIdx === 7) player.vy = -2.5;
      else player.vy = 0;
      player.vx = 0;
      player.scaleX = 0.95; player.scaleY = 1.05;
      player.state = 'ASSEMBLED';
      pieces = [];
      addDust(player.x + player.w/2, player.y + player.h/2, 8);
      beep(320, 480, 0.12, 0.05);
    }
  }

  dust.forEach(d => { d.x += d.vx; d.y += d.vy; d.life -= 0.045; });
  dust = dust.filter(d => d.life > 0);
}

            if (Math.abs(p.vy) < 0.5) p.vy = 0;
          } else if (p.vy < 0) {
            p.y = s.y + s.h; p.vy = 0;
          }
        }
      }
      for (const c of endless.chunks) {
        for (const h of c.hazards) {
          if (hit(p, h)) { p.dead = true; p.deathCause = 'hazard'; break; }
        }
        if (p.dead) break;
      }
      if (p.y > 500 || p.x < endless.cameraX - 100) {
        p.dead = true;
        if (!p.deathCause) p.deathCause = 'oob';
      }
      p.rot += p.vrot;
    });
    pieces.forEach(p => { if (p.dead && p.deathCause === 'hazard') lostParts.add(p.id); });
    pieces = pieces.filter(p => !p.dead);
    if (pieces.length === 0) { endlessDie(); return; }
    if (!pieces.some(p => p.id === anchorId)) pickDefaultAnchor();

    const maxPX = Math.max(...pieces.map(p => p.x + p.w));
    const d = Math.floor(maxPX / 10);
    if (d > endless.distance) endless.distance = d;
  }
  else if (player.state === 'REASSEMBLING') {
    player.timer += 0.09;
    const t = Math.min(player.timer, 1);
    const ease = 1 - Math.pow(1-t, 3);
    pieces.forEach(p => {
      const dx = player.tx + player.w/2 + p.ox - p.w/2;
      const dy = player.ty + player.h/2 + p.oy - p.h/2;
      p.x = p.sx + (dx - p.sx) * ease;
      p.y = p.sy + (dy - p.sy) * ease;
      p.rot *= (1-t);
    });
    if (t >= 1) {
      player.x = player.tx; player.y = player.ty;
      player.px = player.x; player.py = player.y;
      player.vy = 0;
      player.vx = 0;
      player.scaleX = 0.95; player.scaleY = 1.05;
      player.state = 'ASSEMBLED';
      pieces = [];
      addDust(player.x + player.w/2, player.y + player.h/2, 8);
      beep(320, 480, 0.12, 0.05);
    }
  }

  let playerMaxX;
  if (player.state === 'SHATTERED' && pieces.length) {
    playerMaxX = Math.max(...pieces.map(p => p.x + p.w));
  } else {
    playerMaxX = player.x + player.w;
  }
  const targetCamX = playerMaxX - 300;
  if (targetCamX > endless.cameraX) {
    endless.cameraX += Math.min(targetCamX - endless.cameraX, 25);
  }

  if (player.state === 'ASSEMBLED' && player.x < endless.cameraX - 200) {
    endlessDie(); return;
  }

  dust.forEach(d => { d.x += d.vx; d.y += d.vy; d.life -= 0.045; });
  dust = dust.filter(d => d.life > 0);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const cs = Math.floor((s * 100) % 100);
  return `${m}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

function drawEyes(facing) {
  ctx.fillStyle = PAPER;
  const ex = facing >= 0 ? 2 : -2;
  ctx.fillRect(-4+ex, -2, 2.5, 4);
  ctx.fillRect(2+ex, -2, 2.5, 4);
}
function drawPlayerSprite(cx, cy, walk, sx, sy, facing, ignoreLost = false) {
  const swing = Math.sin(walk) * 3.5;
  ctx.save();
  ctx.translate(cx, cy+27); ctx.scale(sx, sy); ctx.translate(0, -27);
  PARTS.forEach((p, idx) => {
    if (!ignoreLost && lostParts.has(idx)) return;
    let ay = 0;
    if (p.limb==='legL') ay = swing;
    if (p.limb==='legR') ay = -swing;
    if (p.limb==='armL') ay = -swing*0.6;
    if (p.limb==='armR') ay = swing*0.6;
    if (p.head) ay = -Math.abs(swing)*0.25;
    ctx.save();
    ctx.translate(p.ox, p.oy+ay);
    ctx.fillStyle = INK;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    if (p.head) drawEyes(facing);
    ctx.restore();
  });
  ctx.restore();
}

function drawGame(alpha) {
  const ix = o => o.px === undefined ? o.x : o.px + (o.x - o.px) * alpha;
  const iy = o => o.py === undefined ? o.y : o.py + (o.y - o.py) * alpha;

  ctx.save();
  if (shakeAmount > 0.5) {
    ctx.translate((Math.random()-0.5) * shakeAmount, (Math.random()-0.5) * shakeAmount);
  }

  ctx.fillStyle = PAPER; ctx.fillRect(-20,-20,W+40,H+40);

  const g = lvl.goal;
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.setLineDash([5,5]); ctx.strokeRect(g.x, g.y, g.w, g.h);
  ctx.setLineDash([]);
  ctx.fillStyle = INK; ctx.fillRect(g.x+g.w/2-3, g.y+g.h/2-3, 6, 6);

  lvl.windZones.forEach(wz => {
    ctx.fillStyle = 'rgba(23,23,23,0.06)';
    ctx.fillRect(wz.x, wz.y, wz.w, wz.h);
    ctx.strokeStyle = 'rgba(23,23,23,0.2)';
    ctx.fillStyle = 'rgba(23,23,23,0.28)';
    ctx.lineWidth = 2;
    const mag = Math.hypot(wz.ax, wz.ay) || 1;
    const ux = wz.ax / mag, uy = wz.ay / mag;
    const len = 26;
    const phase = (animFrame * 1.2) % 60;
    for (let gy = wz.y + 40; gy < wz.y + wz.h - 20; gy += 70) {
      for (let gx = wz.x + 40; gx < wz.x + wz.w - 20; gx += 90) {
        let cx = gx + ux * (phase - 30) * 0.7;
        let cy = gy + uy * (phase - 30) * 0.7;
        ctx.beginPath();
        ctx.moveTo(cx - ux*len/2, cy - uy*len/2);
        ctx.lineTo(cx + ux*len/2, cy + uy*len/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx + ux*len/2, cy + uy*len/2, 2.2, 0, Math.PI*2);
        ctx.fill();
      }
    }
  });

  lvl.doors.forEach(d => {
    ctx.fillStyle = PAPER;
    ctx.fillRect(d.x, d.currY, d.w, d.h);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.strokeRect(d.x, d.currY, d.w, d.h);
    ctx.beginPath();
    ctx.moveTo(d.x, d.currY);
    ctx.lineTo(d.x+d.w, d.currY+d.h);
    ctx.stroke();
  });

  ctx.fillStyle = INK;
  lvl.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

  lvl.breakableWalls.forEach(w => {
    if (w.broken) return;
    ctx.fillStyle = '#555';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = PAPER; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let yy = w.y + 8; yy < w.y + w.h; yy += 12) {
      ctx.moveTo(w.x + 4, yy);
      ctx.lineTo(w.x + w.w - 4, yy + 6);
    }
    ctx.stroke();
  });

  lvl.buttons.forEach(b => {
    if (b.pressed) {
      ctx.fillStyle = '#555';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = INK;
      ctx.fillRect(b.x+4, b.y+4, b.w-8, 4);
      if (b.duration && b.timer > 0) {
        const pct = b.timer / b.duration;
        ctx.fillStyle = '#0a0';
        ctx.fillRect(b.x+4, b.y+2, (b.w-8) * pct, 3);
      }
    } else {
      ctx.fillStyle = INK;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  });

  lvl.springs.forEach(s => {
    const comp = ((s.sq || 0) / 8) * 5;
    const top = s.y + comp;
    const base = s.y + s.h;
    ctx.fillStyle = INK;
    ctx.fillRect(s.x, top, s.w, 4);
    ctx.fillRect(s.x, base - 2, s.w, 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath();
    const segs = 8, x0 = s.x + 6, x1 = s.x + s.w - 6;
    ctx.moveTo(x0, base - 2);
    for (let k = 1; k <= segs; k++) {
      const x = x0 + (x1 - x0) * k / segs;
      ctx.lineTo(x, k % 2 ? top + 4 : base - 2);
    }
    ctx.stroke();
  });

  ctx.fillStyle = INK;
  lvl.hazards.forEach(h => {
    for (let x = h.x; x < h.x+h.w; x += 14) {
      const x2 = Math.min(x + 14, h.x + h.w);
      ctx.beginPath();
      ctx.moveTo(x, h.y+h.h);
      ctx.lineTo((x + x2) / 2, h.y);
      ctx.lineTo(x2, h.y+h.h);
      ctx.fill();
    }
  });

  if (player.state === 'ASSEMBLED') {
    drawPlayerSprite(ix(player)+player.w/2, iy(player)+player.h/2, player.walk, player.scaleX, player.scaleY, player.facing);
  } else {
    const a = pieces.find(p => p.id === anchorId);
    if (a) {
      const ax = ix(a)+a.w/2, ay = iy(a)+a.h/2;
      ctx.strokeStyle = 'rgba(23,23,23,0.25)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3,4]);
      pieces.forEach(p => {
        if (p.id === anchorId) return;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ix(p)+p.w/2, iy(p)+p.h/2); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(ix(p)+p.w/2, iy(p)+p.h/2);
      ctx.rotate(p.rot);
      if (p.id === anchorId) {
        ctx.fillStyle = PAPER;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.fillStyle = INK;
        if (p.head) { ctx.fillRect(-4,-2,2.5,4); ctx.fillRect(2,-2,2.5,4); }
        else ctx.fillRect(-2.5,-2.5,5,5);
      } else {
        ctx.fillStyle = INK;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        if (p.head) drawEyes(player.facing);
      }
      ctx.restore();
    });
  }

  ctx.fillStyle = INK;
  dust.forEach(d => {
    ctx.globalAlpha = Math.max(0, d.life) * 0.6;
    ctx.fillRect(d.x-d.s/2, d.y-d.s/2, d.s, d.s);
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  drawTutorialLabels();

  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.fillText('LEVEL ' + lvl.name, 24, 36);

  speedBtnRect = { x: 100, y: 22, w: 70, h: 18 };
  ctx.fillStyle = gameSpeed === 1.0 ? 'rgba(23,23,23,0.1)' : 'rgba(23,23,23,0.3)';
  ctx.fillRect(speedBtnRect.x, speedBtnRect.y, speedBtnRect.w, speedBtnRect.h);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(speedBtnRect.x, speedBtnRect.y, speedBtnRect.w, speedBtnRect.h);
  ctx.fillStyle = INK;
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${gameSpeed.toFixed(2).replace(/\.?0+$/, '')}x`, speedBtnRect.x + speedBtnRect.w/2, speedBtnRect.y + 13);
  ctx.textAlign = 'left';

  ctx.font = '11px ui-monospace, monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(`Deaths: ${lvlDeaths}`, 24, 52);

  if (lostParts.size > 0) {
    const missing = [];
    if (lostParts.has(3)) missing.push('L-ARM');
    if (lostParts.has(4)) missing.push('R-ARM');
    if (lostParts.has(5)) missing.push('L-LEG');
    if (lostParts.has(6)) missing.push('R-LEG');
    ctx.fillStyle = '#a00';
    ctx.font = 'bold 10px ui-monospace, monospace';
    ctx.fillText(missing.join(' '), 24, 66);
  }

  ctx.textAlign = 'right';
  if (speedrunMode) {
    ctx.fillStyle = '#a00';
    ctx.font = 'bold 22px ui-monospace, monospace';
    ctx.fillText(formatTime(speedrunElapsed), W-24, 38);
    ctx.font = 'bold 10px ui-monospace, monospace';
    ctx.fillText(`L${lvlIdx+1}/${LEVELS.length} · D${lvlDeaths}`, W-24, 54);
  } else {
    ctx.fillStyle = INK;
    ctx.font = 'bold 18px ui-monospace, monospace';
    ctx.fillText(formatTime(lvlTime), W-24, 38);
  }
  ctx.textAlign = 'left';

  if (player.state === 'SHATTERED' && !lvl.isTutorial) {
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px ui-monospace, monospace';
    ctx.fillText('[E] reassemble at the white piece · [WASD] / [Q] / click = pick another', W/2, H-26);
    ctx.textAlign = 'left';
  }

  if (introFrames > 0 && !lvl.isTutorial) {
    const p = 1 - introFrames / INTRO_TOTAL;
    const a = p < 0.15 ? p/0.15 : (p > 0.75 ? (1-p)/0.25 : 1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px ui-monospace, monospace';
    ctx.fillText('LEVEL ' + lvl.name, W/2, 70);
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = '#666';
    ctx.fillText(lvl.hint, W/2, 92);
    ctx.restore();
  } else if (introFrames > 0 && lvl.isTutorial) {
    const p = 1 - introFrames / INTRO_TOTAL;
    const a = p < 0.15 ? p/0.15 : (p > 0.75 ? (1-p)/0.25 : 1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px ui-monospace, monospace';
    ctx.fillText('LEVEL ' + lvl.name, W/2, 70);
    ctx.restore();
  }

  if (completeFrames > 0) {
    const p = 1 - completeFrames / COMPLETE_TOTAL;
    const a = p < 0.25 ? p/0.25 : (p > 0.75 ? (1-p)/0.25 : 1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px ui-monospace, monospace';
    ctx.fillText(`CLEAR · ${formatTime(lvlTime)}`, W/2, H/2);
    if (completeNewBest) {
      ctx.font = 'bold 12px ui-monospace, monospace';
      ctx.fillStyle = '#0a0';
      ctx.fillText('NEW BEST', W/2, H/2 + 22);
    }
    if (speedrunMode) {
      ctx.font = 'bold 12px ui-monospace, monospace';
      ctx.fillStyle = '#a00';
      ctx.fillText(`RUN · ${formatTime(speedrunElapsed)}`, W/2, H/2 + (completeNewBest ? 40 : 22));
    }
    ctx.restore();
  }
}

function drawEndless(alpha) {
  const ix = o => o.px === undefined ? o.x : o.px + (o.x - o.px) * alpha;
  const iy = o => o.py === undefined ? o.y : o.py + (o.y - o.py) * alpha;

  ctx.save();
  if (shakeAmount > 0.5) {
    ctx.translate((Math.random()-0.5) * shakeAmount, (Math.random()-0.5) * shakeAmount);
  }

  ctx.fillStyle = PAPER; ctx.fillRect(-20,-20,W+40,H+40);

  ctx.save();
  ctx.translate(-endless.cameraX, 0);

  ctx.strokeStyle = 'rgba(23,23,23,0.05)';
  ctx.lineWidth = 1;
  const gx0 = Math.floor(endless.cameraX / 60) * 60;
  for (let gx = gx0; gx < endless.cameraX + W; gx += 60) {
    ctx.beginPath();
    ctx.moveTo(gx, 0);
    ctx.lineTo(gx, H);
    ctx.stroke();
  }

  for (const c of endless.chunks) {
    if (c.startX + c.width < endless.cameraX - 100) continue;
    if (c.startX > endless.cameraX + W + 100) continue;

    ctx.fillStyle = INK;
    c.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

    c.hazards.forEach(h => {
      for (let x = h.x; x < h.x+h.w; x += 14) {
        const x2 = Math.min(x + 14, h.x + h.w);
        ctx.beginPath();
        ctx.moveTo(x, h.y+h.h);
        ctx.lineTo((x + x2) / 2, h.y);
        ctx.lineTo(x2, h.y+h.h);
        ctx.fill();
      }
    });
  }

  if (player.state === 'ASSEMBLED') {
    drawPlayerSprite(ix(player)+player.w/2, iy(player)+player.h/2, player.walk, player.scaleX, player.scaleY, player.facing);
  } else {
    const a = pieces.find(p => p.id === anchorId);
    if (a) {
      const ax = ix(a)+a.w/2, ay = iy(a)+a.h/2;
      ctx.strokeStyle = 'rgba(23,23,23,0.25)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3,4]);
      pieces.forEach(p => {
        if (p.id === anchorId) return;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ix(p)+p.w/2, iy(p)+p.h/2); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(ix(p)+p.w/2, iy(p)+p.h/2);
      ctx.rotate(p.rot);
      if (p.id === anchorId) {
        ctx.fillStyle = PAPER;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.fillStyle = INK;
        if (p.head) { ctx.fillRect(-4,-2,2.5,4); ctx.fillRect(2,-2,2.5,4); }
        else ctx.fillRect(-2.5,-2.5,5,5);
      } else {
        ctx.fillStyle = INK;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        if (p.head) drawEyes(player.facing);
      }
      ctx.restore();
    });
  }

  ctx.fillStyle = INK;
  dust.forEach(d => {
    ctx.globalAlpha = Math.max(0, d.life) * 0.6;
    ctx.fillRect(d.x-d.s/2, d.y-d.s/2, d.s, d.s);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
  ctx.restore();

  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillText('ENDLESS (beta)', 24, 36);

  speedBtnRect = { x: 175, y: 22, w: 70, h: 18 };
  ctx.fillStyle = gameSpeed === 1.0 ? 'rgba(23,23,23,0.1)' : 'rgba(23,23,23,0.3)';
  ctx.fillRect(speedBtnRect.x, speedBtnRect.y, speedBtnRect.w, speedBtnRect.h);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(speedBtnRect.x, speedBtnRect.y, speedBtnRect.w, speedBtnRect.h);
  ctx.fillStyle = INK;
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${gameSpeed.toFixed(2).replace(/\.?0+$/, '')}x`, speedBtnRect.x + speedBtnRect.w/2, speedBtnRect.y + 13);
  ctx.textAlign = 'left';

  ctx.font = 'bold 22px ui-monospace, monospace';
  ctx.fillText(`${endless.distance}m`, 24, 62);

  if (lostParts.size > 0) {
    const missing = [];
    if (lostParts.has(3)) missing.push('L-ARM');
    if (lostParts.has(4)) missing.push('R-ARM');
    if (lostParts.has(5)) missing.push('L-LEG');
    if (lostParts.has(6)) missing.push('R-LEG');
    ctx.fillStyle = '#a00';
    ctx.font = 'bold 10px ui-monospace, monospace';
    ctx.fillText(missing.join(' '), 24, 78);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 18px ui-monospace, monospace';
  ctx.fillText(formatTime(endless.runTime), W-24, 36);
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(`Best: ${Math.max(bestEndlessDistance, endless.distance)}m`, W-24, 54);
  ctx.textAlign = 'left';

  if (player.state === 'SHATTERED') {
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px ui-monospace, monospace';
    ctx.fillText('[E] reassemble · [WASD] / [Q] / click = pick another', W/2, H-26);
    ctx.textAlign = 'left';
  }
}

function loop() {
  const now = performance.now();
  const rawDt = lastFrameNow ? Math.min(now - lastFrameNow, 100) : 0;
  lastFrameNow = now;

  const dt = rawDt * gameSpeed;

  animFrame += dt / 16.67;

  if (cheatsHelpTimer > 0) cheatsHelpTimer -= rawDt / 1000;
  if (cheatsHelpTimer < 0) cheatsHelpTimer = 0;

  if (speedrunMode && screen === 'GAME') speedrunElapsed += dt / 1000;

  if (screen === 'MENU') drawMenu();
  else if (screen === 'LEVELS') drawLevelsScreen();
  else if (screen === 'CONTROLS') drawControlsScreen();
  else if (screen === 'CHEATS') drawCheatsScreen();
  else if (screen === 'SPEEDRUN_MENU') drawSpeedrunMenu();
  else if (screen === 'SPEEDRUN_DONE') drawSpeedrunDone();
  else if (screen === 'ENDLESS_DONE') drawEndlessDone();
  else if (screen === 'ENDLESS') {
    acc += dt;
    if (acc > STEP * 5) acc = STEP * 5;
    while (acc >= STEP && screen === 'ENDLESS') {
      updateEndless();
      acc -= STEP;
    }
    if (screen === 'ENDLESS') drawEndless(Math.max(0, Math.min(1, acc / STEP)));
  }
  else if (screen === 'GAME') {
    acc += dt;
    if (acc > STEP * 5) acc = STEP * 5;
    while (acc >= STEP && screen === 'GAME') {
      updateGame();
      acc -= STEP;
    }
    if (screen === 'GAME') drawGame(Math.max(0, Math.min(1, acc / STEP)));
  }

  if (shakeAmount > 0.5) shakeAmount *= 0.88;
  else shakeAmount = 0;

  requestAnimationFrame(loop);
}

openMenu();
loop();
</script>
