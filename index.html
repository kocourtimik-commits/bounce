let actx = null;
function beep(f1, f2, dur = 0.12, vol = 0.05) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f1, actx.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem('bounceback_v11', JSON.stringify({
      done: [...done], bestTimes, bestDeaths, totalDeaths, bestSpeedrun, speedrunAttempts
    }));
  } catch(e) {}
}
function loadProgress() {
  try {
    const raw = localStorage.getItem('bounceback_v11');
    if (!raw) {
      const old = localStorage.getItem('bounceback_v10') || localStorage.getItem('bounceback_v9') || localStorage.getItem('bounceback_v8') || localStorage.getItem('bounceback_v7') || localStorage.getItem('bounceback_v6') || localStorage.getItem('bounceback_v5');
      if (old) {
        const d = JSON.parse(old);
        if (d.done) done = new Set([...d.done].filter(i => i < LEVELS.length));
        if (d.bestTimes) bestTimes = d.bestTimes;
        if (d.bestDeaths) bestDeaths = d.bestDeaths;
        if (d.totalDeaths) totalDeaths = d.totalDeaths;
        if (d.bestSpeedrun) bestSpeedrun = d.bestSpeedrun;
        if (d.speedrunAttempts) speedrunAttempts = d.speedrunAttempts;
      }
      return;
    }
    const d = JSON.parse(raw);
    if (d.done) done = new Set([...d.done].filter(i => i < LEVELS.length));
    if (d.bestTimes) bestTimes = d.bestTimes;
    if (d.bestDeaths) bestDeaths = d.bestDeaths;
    if (d.totalDeaths) totalDeaths = d.totalDeaths;
    if (d.bestSpeedrun) bestSpeedrun = d.bestSpeedrun;
    if (d.speedrunAttempts) speedrunAttempts = d.speedrunAttempts;
  } catch(e) {}
}

      speedrunMode = false;
      screen = 'SPEEDRUN_DONE';
      saveProgress();
      return;
    }
    openMenu();
    return;

  screen = 'GAME';
  lvlIdx = i;
  lvl = JSON.parse(JSON.stringify(LEVELS[i]));
  resetPlayerToSpawn();
  introTotal = INTRO_TOTAL;
  introFrames = introTotal;
  completeFrames = 0;
  completeNewBest = false;
  lvlTime = 0;
  lvlDeaths = 0;
  lvlStartTime = performance.now();

    grounded: false, coyote: 0, state: 'ASSEMBLED', scaleX: 1, scaleY: 1

}
function die() {
  const px = player.x + player.w/2;
  const py = player.y + player.h/2;
  lvlDeaths++;
  totalDeaths++;
  shakeAmount = 12;
  beep(150, 60, 0.3);
  saveProgress();
  resetPlayerToSpawn();
  addDust(px, py, 20);
}

function solids() {
  const s = [...lvl.walls];
  lvl.doors.forEach(d => s.push({ x: d.x, y: d.currY, w: d.w, h: d.h }));
  (lvl.breakableWalls || []).forEach(w => {
    if (!w.broken) s.push({ x: w.x, y: w.y, w: w.w, h: w.h });
  });
  return s;
}
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function addDust(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.2;
    dust.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-0.5, life: 1, s: 3+Math.random()*2 });
  }
}

function shatter() {
  if (player.state !== 'ASSEMBLED') return;
  player.state = 'SHATTERED';
  beep(220, 90, 0.14);
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  const boostVx = player.vx * 1.5 + player.facing * 2.5;
  pieces = PARTS.map(p => ({
    x: cx + p.ox - p.w/2, y: cy + p.oy - p.h/2,
    w: p.w, h: p.h, ox: p.ox, oy: p.oy, head: !!p.head,
    vx: boostVx + p.ox*0.14 + (Math.random()-0.5)*0.8,
    vy: player.vy*0.85 + p.oy*0.04 - 1.2,
    rot: 0, vrot: (Math.random()-0.5)*0.1,
    dead: false
  }));
  let best = 0;
  pieces.forEach((p, i) => {
    if (player.facing >= 0 ? p.x > pieces[best].x : p.x < pieces[best].x) best = i;
  });
  anchorIdx = best;
  addDust(cx, cy, 10);
}

function reassemble() {
  if (player.state !== 'SHATTERED' || !pieces.length) return;
  const a = pieces[anchorIdx];
  if (!a || a.dead) { anchorIdx = 0; return; }
  const acx = a.x + a.w/2, acy = a.y + a.h/2;
  let tx = acx - a.ox - player.w/2;
  let ty = acy - a.oy - player.h/2 - 2;
  const sol = solids();
  for (let iter = 0; iter < 3; iter++) {
    for (let s of sol) {
      if (hit({x:tx,y:ty,w:player.w,h:player.h}, s)) {
        const oT = (ty+player.h)-s.y, oB = (s.y+s.h)-ty;
        const oL = (tx+player.w)-s.x, oR = (s.x+s.w)-tx;
        const m = Math.min(oT,oB,oL,oR);
        if (m===oT) ty = s.y-player.h;
        else if (m===oB) ty = s.y+s.h;
        else if (m===oL) tx = s.x-player.w;
        else tx = s.x+s.w;
      }
    }
  }

  // CLAMP reassembly do hratelné zóny — zabrání vypadnutí mimo mapu
  tx = Math.max(16, Math.min(tx, 864 - player.w));
  ty = Math.max(16, Math.min(ty, 390 - player.h));

  player.tx = tx; player.ty = ty;
  player.state = 'REASSEMBLING'; player.timer = 0;
  pieces.forEach(p => { p.sx = p.x; p.sy = p.y; });
  beep(280, 560, 0.16);
  addDust(acx, acy, 10);
}

function activateMenuSelection(idx) {
  beep(360, 520, 0.1);
  const items = getMenuItems();
  const sel = items[idx];
  if (sel === 'PLAY') loadLevel(lvlIdx);
  else if (sel === 'LEVELS') openLevels();
  else if (sel === 'CONTROLS') openControls();
  else if (sel === 'SPEEDRUN') openSpeedrunMenu();
}

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') {
    if (screen === 'GAME' || screen === 'LEVELS' || screen === 'CONTROLS' || screen === 'SPEEDRUN_DONE' || screen === 'SPEEDRUN_MENU') {
      if (speedrunMode) speedrunMode = false;
      openMenu();
    }
    return;
  }
  if (screen === 'MENU') {
    if (!keys[e.code]) {
      const items = getMenuItems();
      if (e.code==='ArrowUp'||e.code==='KeyW') { menuIndex=(menuIndex+items.length-1)%items.length; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowDown'||e.code==='KeyS') { menuIndex=(menuIndex+1)%items.length; beep(300,360,0.05,0.03); }
      else if (e.code==='Enter'||e.code==='Space') activateMenuSelection(menuIndex);
    }
    keys[e.code]=true; return;
  }
  if (screen === 'SPEEDRUN_MENU') {
    if (!keys[e.code] && (e.code==='Enter'||e.code==='Space')) startSpeedrun();
    keys[e.code]=true; return;
  }
  if (screen === 'LEVELS') {
    if (!keys[e.code]) {
      const cols = 5, total = LEVELS.length;
      if (e.code==='ArrowLeft') { levelHoverIdx = (levelHoverIdx - 1 + total) % total; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowRight') { levelHoverIdx = (levelHoverIdx + 1) % total; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowUp') { levelHoverIdx = (levelHoverIdx - cols + total) % total; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowDown') { levelHoverIdx = (levelHoverIdx + cols) % total; beep(300,360,0.05,0.03); }
      else if (e.code==='Enter'||e.code==='Space') { beep(360,520,0.1); loadLevel(levelHoverIdx); }
    }
    keys[e.code]=true; return;
  }
  if (screen === 'CONTROLS') {
    if (!keys[e.code] && (e.code==='Enter'||e.code==='Space')) openMenu();
    keys[e.code]=true; return;
  }
  if (screen === 'SPEEDRUN_DONE') {
    if (!keys[e.code] && (e.code==='Enter'||e.code==='Space')) openSpeedrunMenu();
    keys[e.code]=true; return;
  }
  if (!keys[e.code]) {
    if (e.code === 'KeyE') {
      if (player.state === 'ASSEMBLED') shatter();
      else if (player.state === 'SHATTERED') reassemble();
    }
    if (e.code === 'KeyQ' && player.state === 'SHATTERED') {
      for (let k = 0; k < pieces.length; k++) {
        anchorIdx = (anchorIdx + 1) % pieces.length;
        if (!pieces[anchorIdx].dead) break;
      }
      beep(440, 520, 0.06, 0.04);
    }
    if (e.code === 'KeyR') {
      lvlDeaths++; totalDeaths++; resetPlayerToSpawn();
      lvlStartTime = performance.now(); lvlTime = 0;
      introFrames = INTRO_TOTAL;
      saveProgress();
    }
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (screen === 'MENU') {
    menuButtonsRects.forEach((b, i) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) menuIndex = i;
    });
  } else if (screen === 'LEVELS') {
    levelButtonsRects.forEach((b) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) levelHoverIdx = b.idx;
    });
  }
});
canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (screen === 'MENU') {
    menuButtonsRects.forEach((b, i) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) activateMenuSelection(i);
    });
    return;
  }
  if (screen === 'LEVELS') {
    levelButtonsRects.forEach((b) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) { beep(360,520,0.1); loadLevel(b.idx); }
    });
    if (backButtonRect && mx>=backButtonRect.x && mx<=backButtonRect.x+backButtonRect.w && my>=backButtonRect.y && my<=backButtonRect.y+backButtonRect.h) {
      openMenu();
    }
    return;
  }
  if (screen === 'CONTROLS') { openMenu(); return; }
  if (screen === 'SPEEDRUN_MENU') { startSpeedrun(); return; }
  if (screen === 'SPEEDRUN_DONE') { openSpeedrunMenu(); return; }
  if (player.state !== 'SHATTERED') return;
  let best=-1, minD=60;
  pieces.forEach((p,i)=>{
    if (p.dead) return;
    const d=Math.hypot(p.x+p.w/2-mx,p.y+p.h/2-my);
    if(d<minD){minD=d;best=i;}
  });
  if (best!==-1) { anchorIdx=best; beep(480,580,0.06,0.04); }
});

function updateGame() {
  if (introFrames > 0) introFrames--;

  if (completeFrames > 0) {
    completeFrames--;
    if (completeFrames === 0) loadLevel(lvlIdx + 1);
    return;
  }

  lvlTime = (performance.now() - lvlStartTime) / 1000;

  // Buttons
  lvl.buttons.forEach(b => {
    if (b.duration) {
      if (b.timer > 0) {
        b.timer--;
        if (b.timer === 0) b.pressed = false;
      }
      let active = false;
      if (player.state === 'ASSEMBLED' && hit(player, b)) active = true;
      if (player.state !== 'ASSEMBLED') {
        for (let p of pieces) if (!p.dead && hit(p, b)) { active = true; break; }
      }
      if (active) {
        if (!b.pressed) beep(360, 520, 0.1, 0.05);
        b.pressed = true;
        b.timer = b.duration;
      }
    } else {
      if (b.pressed) return;
      let active = false;
      if (player.state === 'ASSEMBLED' && hit(player, b)) active = true;
      if (player.state !== 'ASSEMBLED') {
        for (let p of pieces) if (!p.dead && hit(p, b)) { active = true; break; }
      }
      if (active) { b.pressed = true; beep(360, 520, 0.1, 0.05); }
    }
  });

  // Doors
  lvl.doors.forEach(d => {
    const b = lvl.buttons.find(btn => btn.id === d.id);
    if (b && b.pressed) d.currY += (d.openY - d.currY) * 0.14;
    else d.currY += (d.y - d.currY) * 0.14;
  });

  player.scaleX += (1-player.scaleX)*0.18;
  player.scaleY += (1-player.scaleY)*0.18;

  if (player.state === 'ASSEMBLED') {
    const sol = solids();

    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const targetVx = left ? -player.speed : right ? player.speed : 0;
    player.vx += (targetVx - player.vx) * 0.25;
    if (Math.abs(player.vx) > 0.3) {
      player.facing = player.vx > 0 ? 1 : -1;
      if (player.grounded) player.walk += Math.abs(player.vx) * 0.06;
    } else player.walk = 0;
    if (player.grounded) player.coyote = 8;
    else if (player.coyote > 0) player.coyote--;
    if ((keys['Space']||keys['ArrowUp']||keys['KeyW']) && player.coyote > 0) {
      player.vy = player.jump; player.grounded = false; player.coyote = 0;
      player.scaleX = 0.82; player.scaleY = 1.22;
      beep(240, 420, 0.1);
      addDust(player.x + player.w/2, player.y + player.h, 5);
    }
    player.vy += GRAVITY;
    player.x += player.vx;
    for (let s of sol) {
      if (hit(player, s)) {
        if (player.vx > 0) player.x = s.x - player.w;
        else if (player.vx < 0) player.x = s.x + s.w;
        player.vx = 0;
      }
    }
    const wasG = player.grounded;
    player.y += player.vy;
    player.grounded = false;
    for (let s of sol) {
      if (hit(player, s)) {
        if (player.vy > 0) {
          if (!wasG && player.vy > 3) {
            player.scaleX = 1.2; player.scaleY = 0.82;
            addDust(player.x+player.w/2, s.y, 4);
          }
          player.y = s.y - player.h; player.vy = 0; player.grounded = true;
        } else if (player.vy < 0) {
          player.y = s.y + s.h; player.vy = 0;
        }
      }
    }
    (lvl.windZones || []).forEach(wz => {
      if (hit(player, wz)) {
        player.vx += wz.vx * 0.4;
        player.vy += wz.vy * 0.4;
      }
    });

    // Safety: vypadl jsem z mapy? Respawn
    if (player.y > 460 || player.y < -100 || player.x < -50 || player.x > 930) {
      die();
      return;
    }

    for (let h of lvl.hazards) {
      if (hit(player, h)) { die(); return; }
    }
    if (hit(player, lvl.goal)) {
      lvlTime = (performance.now() - lvlStartTime) / 1000;
      const isNew = !bestTimes[lvlIdx] || lvlTime < bestTimes[lvlIdx];
      done.add(lvlIdx);
      if (isNew) bestTimes[lvlIdx] = lvlTime;
      if (!bestDeaths[lvlIdx] || lvlDeaths < bestDeaths[lvlIdx]) bestDeaths[lvlIdx] = lvlDeaths;
      saveProgress();
      beep(440, 660, 0.14);
      completeNewBest = isNew && !speedrunMode;
      completeFrames = COMPLETE_TOTAL;
      return;
    }
  }
  else if (player.state === 'SHATTERED') {
    // PRE-PASS: rozbíjení skla (prediktivní check)
    (lvl.breakableWalls || []).forEach(w => {
      if (w.broken) return;
      for (let p of pieces) {
        if (p.dead) continue;
        const speed = Math.hypot(p.vx, p.vy);
        if (speed > 2) {
          const test = { x: p.x + p.vx, y: p.y + p.vy, w: p.w, h: p.h };
          if (hit(test, w)) {
            w.broken = true;
            addDust(w.x + w.w/2, w.y + w.h/2, 25);
            beep(140, 60, 0.2);
            break;
          }
        }
      }
    });

    // Rebuild solids (broken walls excluded)
    const sol = solids();

    pieces.forEach(p => {
      if (p.dead) return;
      p.vy += GRAVITY;
      p.x += p.vx;
      for (let s of sol) {
        if (hit(p, s)) {
          if (p.vx > 0) p.x = s.x - p.w;
          else if (p.vx < 0) p.x = s.x + s.w;
          p.vx = -p.vx * 0.35;
        }
      }
      p.y += p.vy;
      for (let s of sol) {
        if (hit(p, s)) {
          if (p.vy > 0) {
            p.y = s.y - p.h; p.vy = -p.vy * 0.22;
            p.vx *= 0.91; p.vrot *= 0.6;
            if (Math.abs(p.vy) < 0.5) p.vy = 0;
          } else if (p.vy < 0) {
            p.y = s.y + s.h; p.vy = 0;
          }
        }
      }
      (lvl.windZones || []).forEach(wz => {
        if (hit(p, wz)) {
          p.vx += wz.vx * 0.6;
          p.vy += wz.vy * 0.6;
        }
      });
      for (let h of lvl.hazards) {
        if (hit(p, h)) { p.dead = true; break; }
      }
      if (p.y > 500 || p.x < -50 || p.x > 930) p.dead = true;
      p.rot += p.vrot;
    });
    pieces = pieces.filter(p => !p.dead);
    if (pieces.length === 0) { die(); return; }
    if (!pieces[anchorIdx] || pieces[anchorIdx].dead) anchorIdx = 0;
  }
  else if (player.state === 'REASSEMBLING') {
    player.timer += 0.09;
    const t = Math.min(player.timer, 1);
    const ease = 1 - Math.pow(1-t, 3);
    pieces.forEach(p => {
      const dx = player.tx + player.w/2 + p.ox - p.w/2;
      const dy = player.ty + player.h/2 + p.oy - p.h/2;
      p.x = p.sx + (dx - p.sx) * ease;
      p.y = p.sy + (dy - p.sy) * ease;
      p.rot *= (1-t);
    });
    if (t >= 1) {
      player.x = player.tx; player.y = player.ty;
      if (lvlIdx === 6 || lvlIdx === 7) player.vy = -4.5;
      else player.vy = 0;
      player.vx = 0;
      player.scaleX = 0.95; player.scaleY = 1.05;
      player.state = 'ASSEMBLED';
      pieces = [];
      addDust(player.x + player.w/2, player.y + player.h/2, 8);
      beep(320, 480, 0.12, 0.05);
    }
  }

  dust.forEach(d => { d.x += d.vx; d.y += d.vy; d.life -= 0.045; });
  dust = dust.filter(d => d.life > 0);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const cs = Math.floor((s * 100) % 100);
  return `${m}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

function drawEyes(facing) {
  ctx.fillStyle = PAPER;
  const ex = facing >= 0 ? 2 : -2;
  ctx.fillRect(-4+ex, -2, 2.5, 4);
  ctx.fillRect(2+ex, -2, 2.5, 4);
}
function drawPlayerSprite(cx, cy, walk, sx, sy, facing) {
  const swing = Math.sin(walk) * 3.5;
  ctx.save();
  ctx.translate(cx, cy+27); ctx.scale(sx, sy); ctx.translate(0, -27);
  PARTS.forEach(p => {
    let ay = 0;
    if (p.limb==='legL') ay = swing;
    if (p.limb==='legR') ay = -swing;
    if (p.limb==='armL') ay = -swing*0.6;
    if (p.limb==='armR') ay = swing*0.6;
    if (p.head) ay = -Math.abs(swing)*0.25;
    ctx.save();
    ctx.translate(p.ox, p.oy+ay);
    ctx.fillStyle = INK;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    if (p.head) drawEyes(facing);
    ctx.restore();
  });
  ctx.restore();
}

function drawGame() {
  ctx.save();
  if (shakeAmount > 0.5) {
    ctx.translate((Math.random()-0.5) * shakeAmount, (Math.random()-0.5) * shakeAmount);
  }

  ctx.fillStyle = PAPER; ctx.fillRect(-20,-20,W+40,H+40);

  const g = lvl.goal;
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.setLineDash([5,5]); ctx.strokeRect(g.x, g.y, g.w, g.h);
  ctx.setLineDash([]);
  ctx.fillStyle = INK; ctx.fillRect(g.x+g.w/2-3, g.y+g.h/2-3, 6, 6);

  ctx.fillStyle = INK;
  lvl.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

  (lvl.breakableWalls || []).forEach(w => {
    if (w.broken) return;
    ctx.fillStyle = '#555';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = PAPER; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let yy = w.y + 8; yy < w.y + w.h; yy += 12) {
      ctx.moveTo(w.x + 4, yy);
      ctx.lineTo(w.x + w.w - 4, yy + 6);
    }
    ctx.stroke();
  });

  (lvl.windZones || []).forEach(wz => {
    ctx.fillStyle = 'rgba(23,23,23,0.06)';
    ctx.fillRect(wz.x, wz.y, wz.w, wz.h);
    ctx.strokeStyle = 'rgba(23,23,23,0.18)';
    ctx.lineWidth = 2;
    const cx = wz.x + wz.w/2, cy = wz.y + wz.h/2;
    const len = 25;
    const mag = Math.hypot(wz.vx, wz.vy) || 1;
    const dx = (wz.vx / mag) * len;
    const dy = (wz.vy / mag) * len;
    for (let oy = -60; oy <= 60; oy += 60) {
      for (let ox = -80; ox <= 80; ox += 80) {
        if (cx+ox < wz.x+20 || cx+ox > wz.x+wz.w-20) continue;
        if (cy+oy < wz.y+20 || cy+oy > wz.y+wz.h-20) continue;
        ctx.beginPath();
        ctx.moveTo(cx+ox-dx/2, cy+oy-dy/2);
        ctx.lineTo(cx+ox+dx/2, cy+oy+dy/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx+ox+dx/2, cy+oy+dy/2, 2, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(23,23,23,0.25)';
        ctx.fill();
      }
    }
  });

  lvl.buttons.forEach(b => {
    if (b.pressed) {
      ctx.fillStyle = '#555';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = INK;
      ctx.fillRect(b.x+4, b.y+4, b.w-8, 4);
      if (b.duration && b.timer > 0) {
        const pct = b.timer / b.duration;
        ctx.fillStyle = '#0a0';
        ctx.fillRect(b.x+4, b.y+2, (b.w-8) * pct, 3);
      }
    } else {
      ctx.fillStyle = INK;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  });

  lvl.doors.forEach(d => {
    ctx.fillStyle = PAPER;
    ctx.fillRect(d.x, d.currY, d.w, d.h);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.strokeRect(d.x, d.currY, d.w, d.h);
    ctx.beginPath();
    ctx.moveTo(d.x, d.currY);
    ctx.lineTo(d.x+d.w, d.currY+d.h);
    ctx.stroke();
  });

  ctx.fillStyle = INK;
  lvl.hazards.forEach(h => {
    for (let x = h.x; x < h.x+h.w; x += 14) {
      ctx.beginPath();
      ctx.moveTo(x, h.y+h.h);
      ctx.lineTo(x+7, h.y);
      ctx.lineTo(x+14, h.y+h.h);
      ctx.fill();
    }
  });

  if (player.state === 'ASSEMBLED') {
    drawPlayerSprite(player.x+player.w/2, player.y+player.h/2, player.walk, player.scaleX, player.scaleY, player.facing);
  } else {
    const a = pieces[anchorIdx];
    if (a && !a.dead) {
      const ax = a.x+a.w/2, ay = a.y+a.h/2;
      ctx.strokeStyle = 'rgba(23,23,23,0.25)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3,4]);
      pieces.forEach((p,i) => {
        if (i===anchorIdx || p.dead) return;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(p.x+p.w/2, p.y+p.h/2); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    pieces.forEach((p,i) => {
      if (p.dead) return;
      ctx.save();
      ctx.translate(p.x+p.w/2, p.y+p.h/2);
      ctx.rotate(p.rot);
      if (i === anchorIdx) {
        ctx.fillStyle = PAPER;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.fillStyle = INK;
        if (p.head) { ctx.fillRect(-4,-2,2.5,4); ctx.fillRect(2,-2,2.5,4); }
        else ctx.fillRect(-2.5,-2.5,5,5);
      } else {
        ctx.fillStyle = INK;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        if (p.head) drawEyes(player.facing);
      }
      ctx.restore();
    });
  }

  ctx.fillStyle = INK;
  dust.forEach(d => {
    ctx.globalAlpha = d.life * 0.6;
    ctx.fillRect(d.x-d.s/2, d.y-d.s/2, d.s, d.s);
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  // HUD
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.fillText(lvl.name, 20, 28);
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillStyle = '#666';
  ctx.fillText(`Deaths: ${lvlDeaths}`, 20, 44);

  ctx.textAlign = 'right';
  if (speedrunMode) {
    ctx.fillStyle = '#a00';
    ctx.font = 'bold 22px ui-monospace, monospace';
    ctx.fillText(formatTime(speedrunElapsed), W-20, 30);
    ctx.font = 'bold 10px ui-monospace, monospace';
    ctx.fillText(`L${lvlIdx+1}/${LEVELS.length} · D${lvlDeaths}`, W-20, 46);
  } else {
    ctx.fillStyle = INK;
    ctx.font = 'bold 18px ui-monospace, monospace';
    ctx.fillText(formatTime(lvlTime), W-20, 30);
  }
  ctx.textAlign = 'left';

  if (introFrames > 0) {
    const p = 1 - introFrames / introTotal;
    const alpha = p < 0.15 ? p/0.15 : (p > 0.75 ? (1-p)/0.25 : 1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px ui-monospace, monospace';
    ctx.fillText(lvl.name, W/2, 55);
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(lvl.hint, W/2, 75);
    ctx.restore();
  }

  if (completeFrames > 0) {
    const p = 1 - completeFrames / COMPLETE_TOTAL;
    const alpha = p < 0.25 ? p/0.25 : (p > 0.75 ? (1-p)/0.25 : 1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px ui-monospace, monospace';
    ctx.fillText(`CLEAR · ${formatTime(lvlTime)}`, W/2, H/2);
    if (completeNewBest) {
      ctx.font = 'bold 12px ui-monospace, monospace';
      ctx.fillStyle = '#0a0';
      ctx.fillText('NEW BEST', W/2, H/2 + 22);
    }
    if (speedrunMode) {
      ctx.font = 'bold 12px ui-monospace, monospace';
      ctx.fillStyle = '#a00';
      ctx.fillText(`RUN · ${formatTime(speedrunElapsed)}`, W/2, H/2 + (completeNewBest ? 40 : 22));
    }
    ctx.restore();
  }
}

function loop() {
  const now = performance.now();
  const dt = lastFrameNow ? Math.min(now - lastFrameNow, 100) : 0;
  lastFrameNow = now;

  animFrame++;

  if (speedrunMode && screen === 'GAME') {
    speedrunElapsed += dt / 1000;
  }

  if (screen === 'MENU') drawMenu();
  else if (screen === 'LEVELS') drawLevelsScreen();
  else if (screen === 'CONTROLS') drawControlsScreen();
  else if (screen === 'SPEEDRUN_MENU') drawSpeedrunMenu();
  else if (screen === 'SPEEDRUN_DONE') drawSpeedrunDone();
  else {
    physAccum += SLOW_FACTOR;
    while (physAccum >= 1) {
      updateGame();
      physAccum -= 1;
    }
    drawGame();
  }

  if (shakeAmount > 0.5) shakeAmount *= 0.88;
  else shakeAmount = 0;

  requestAnimationFrame(loop);
}

openMenu();
loop();
</script>
</body>
</html>
