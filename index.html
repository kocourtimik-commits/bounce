let actx = null;
function beep(f1, f2, dur = 0.12, vol = 0.05) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f1, actx.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e) {}
}

let screen = 'MENU';
let menuIndex = 0;
const MENU_ITEMS = ['PLAY', 'LEVELS', 'CONTROLS'];
let menuButtonsRects = [];
let levelButtonsRects = [];
let backButtonRect = null;
let levelHoverIdx = 0;
let lvlIdx = 0;
let done = new Set();
let lvl = null;

const GRAVITY = 0.36;
let player = {
  x: 0, y: 0, w: 32, h: 54,
  vx: 0, vy: 0, speed: 4.8, jump: -10.2,
  grounded: false, coyote: 0,
  state: 'ASSEMBLED', timer: 0, tx: 0, ty: 0,
  facing: 1, walk: 0, scaleX: 1, scaleY: 1
};

let pieces = [];
let anchorIdx = 0;
let dust = [];
let keys = {};
let animFrame = 0;

function openMenu() { screen = 'MENU'; }
function openLevels() { screen = 'LEVELS'; levelHoverIdx = 0; }
function openControls() { screen = 'CONTROLS'; }
function loadLevel(i) {
  if (i >= LEVELS.length) { openMenu(); return; }
  screen = 'GAME';
  lvlIdx = i;
  lvl = JSON.parse(JSON.stringify(LEVELS[i]));
  resetPlayerToSpawn();
}
function resetPlayerToSpawn() {
  Object.assign(player, {
    x: lvl.spawn.x, y: lvl.spawn.y, vx: 0, vy: 0,
    grounded: false, coyote: 0, state: 'ASSEMBLED', scaleX: 1, scaleY: 1
  });
  pieces = []; dust = []; anchorIdx = 0;
}

function solids() {
  const s = [...lvl.walls];
  lvl.doors.forEach(d => s.push({ x: d.x, y: d.currY, w: d.w, h: d.h }));
  return s;
}
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function addDust(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.2;
    dust.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-0.5, life: 1, s: 3+Math.random()*2 });
  }
}

function shatter() {
  if (player.state !== 'ASSEMBLED') return;
  player.state = 'SHATTERED';
  beep(220, 90, 0.14);
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  const boostVx = player.vx * 1.5 + player.facing * 2.5;
  pieces = PARTS.map(p => ({
    x: cx + p.ox - p.w/2, y: cy + p.oy - p.h/2,
    w: p.w, h: p.h, ox: p.ox, oy: p.oy, head: !!p.head,
    vx: boostVx + p.ox*0.14 + (Math.random()-0.5)*0.8,
    vy: player.vy*0.85 + p.oy*0.04 - 1.2,
    rot: 0, vrot: (Math.random()-0.5)*0.1,
    dead: false
  }));
  let best = 0;
  pieces.forEach((p, i) => {
    if (player.facing >= 0 ? p.x > pieces[best].x : p.x < pieces[best].x) best = i;
  });
  anchorIdx = best;
  addDust(cx, cy, 10);
}

function reassemble() {
  if (player.state !== 'SHATTERED' || !pieces.length) return;
  const a = pieces[anchorIdx];
  if (!a || a.dead) { anchorIdx = 0; return; }
  const acx = a.x + a.w/2, acy = a.y + a.h/2;
  let tx = acx - a.ox - player.w/2;
  let ty = acy - a.oy - player.h/2 - 2;
  const sol = solids();
  for (let iter = 0; iter < 3; iter++) {
    for (let s of sol) {
      if (hit({x:tx,y:ty,w:player.w,h:player.h}, s)) {
        const oT = (ty+player.h)-s.y, oB = (s.y+s.h)-ty;
        const oL = (tx+player.w)-s.x, oR = (s.x+s.w)-tx;
        const m = Math.min(oT,oB,oL,oR);
        if (m===oT) ty = s.y-player.h;
        else if (m===oB) ty = s.y+s.h;
        else if (m===oL) tx = s.x-player.w;
        else tx = s.x+s.w;
      }
    }
  }
  player.tx = tx; player.ty = ty;
  player.state = 'REASSEMBLING'; player.timer = 0;
  pieces.forEach(p => { p.sx = p.x; p.sy = p.y; });
  beep(280, 560, 0.16);
  addDust(acx, acy, 10);
}

function activateMenuSelection(idx) {
  beep(360, 520, 0.1);
  if (idx === 0) loadLevel(lvlIdx);
  else if (idx === 1) openLevels();
  else if (idx === 2) openControls();
}

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') { if (screen !== 'MENU') openMenu(); return; }
  
  if (screen === 'MENU') {
    if (!keys[e.code]) {
      if (e.code==='ArrowUp'||e.code==='KeyW') { menuIndex=(menuIndex+MENU_ITEMS.length-1)%MENU_ITEMS.length; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowDown'||e.code==='KeyS') { menuIndex=(menuIndex+1)%MENU_ITEMS.length; beep(300,360,0.05,0.03); }
      else if (e.code==='Enter'||e.code==='Space') activateMenuSelection(menuIndex);
    }
    keys[e.code]=true; return;
  }
  if (screen === 'LEVELS') {
    if (!keys[e.code]) {
      if (e.code==='ArrowLeft') { levelHoverIdx = levelHoverIdx===0 ? 4 : levelHoverIdx===5 ? 9 : levelHoverIdx-1; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowRight') { levelHoverIdx = levelHoverIdx===4 ? 0 : levelHoverIdx===9 ? 5 : levelHoverIdx+1; beep(300,360,0.05,0.03); }
      else if (e.code==='ArrowUp'||e.code==='ArrowDown') { levelHoverIdx = (levelHoverIdx + 5) % 10; beep(300,360,0.05,0.03); }
      else if (e.code==='Enter'||e.code==='Space') { beep(360,520,0.1); loadLevel(levelHoverIdx); }
    }
    keys[e.code]=true; return;
  }
  if (screen === 'CONTROLS') {
    if (!keys[e.code] && (e.code==='Enter'||e.code==='Space')) openMenu();
    keys[e.code]=true; return;
  }
  if (!keys[e.code]) {
    if (e.code === 'KeyE') {
      if (player.state === 'ASSEMBLED') shatter();
      else if (player.state === 'SHATTERED') reassemble();
    }
    if (e.code === 'KeyQ' && player.state === 'SHATTERED') {
      for (let k = 0; k < pieces.length; k++) {
        anchorIdx = (anchorIdx + 1) % pieces.length;
        if (!pieces[anchorIdx].dead) break;
      }
      beep(440, 520, 0.06, 0.04);
    }
    if (e.code === 'KeyR') loadLevel(lvlIdx);
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (screen === 'MENU') {
    menuButtonsRects.forEach((b, i) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) menuIndex = i;
    });
  } else if (screen === 'LEVELS') {
    levelButtonsRects.forEach((b) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) levelHoverIdx = b.idx;
    });
  }
});
canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (screen === 'MENU') {
    menuButtonsRects.forEach((b, i) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) activateMenuSelection(i);
    });
    return;
  }
  if (screen === 'LEVELS') {
    levelButtonsRects.forEach((b) => {
      if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) { beep(360,520,0.1); loadLevel(b.idx); }
    });
    if (backButtonRect && mx>=backButtonRect.x && mx<=backButtonRect.x+backButtonRect.w && my>=backButtonRect.y && my<=backButtonRect.y+backButtonRect.h) {
      openMenu();
    }
    return;
  }
  if (screen === 'CONTROLS') { openMenu(); return; }
  if (player.state !== 'SHATTERED') return;
  let best=-1, minD=60;
  pieces.forEach((p,i)=>{
    if (p.dead) return;
    const d=Math.hypot(p.x+p.w/2-mx,p.y+p.h/2-my);
    if(d<minD){minD=d;best=i;}
  });
  if (best!==-1) { anchorIdx=best; beep(480,580,0.06,0.04); }
});

function updateGame() {
  const sol = solids();

  lvl.buttons.forEach(b => {
    if (b.pressed) return;
    let active = false;
    if (player.state === 'ASSEMBLED' && hit(player, b)) active = true;
    if (player.state !== 'ASSEMBLED') {
      for (let p of pieces) if (!p.dead && hit(p, b)) { active = true; break; }
    }
    if (active) { b.pressed = true; beep(360, 520, 0.1, 0.05); }
  });

  lvl.doors.forEach(d => {
    const b = lvl.buttons.find(btn => btn.id === d.id);
    if (b && b.pressed) d.currY += (d.openY - d.currY) * 0.14;
    else d.currY += (d.y - d.currY) * 0.14;
  });

  player.scaleX += (1-player.scaleX)*0.18;
  player.scaleY += (1-player.scaleY)*0.18;

  if (player.state === 'ASSEMBLED') {
    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    const targetVx = left ? -player.speed : right ? player.speed : 0;
    player.vx += (targetVx - player.vx) * 0.25;
    if (Math.abs(player.vx) > 0.3) {
      player.facing = player.vx > 0 ? 1 : -1;
      if (player.grounded) player.walk += Math.abs(player.vx) * 0.06;
    } else player.walk = 0;
    if (player.grounded) player.coyote = 8;
    else if (player.coyote > 0) player.coyote--;
    if ((keys['Space']||keys['ArrowUp']||keys['KeyW']) && player.coyote > 0) {
      player.vy = player.jump; player.grounded = false; player.coyote = 0;
      player.scaleX = 0.82; player.scaleY = 1.22;
      beep(240, 420, 0.1);
      addDust(player.x + player.w/2, player.y + player.h, 5);
    }
    player.vy += GRAVITY;
    player.x += player.vx;
    for (let s of sol) {
      if (hit(player, s)) {
        if (player.vx > 0) player.x = s.x - player.w;
        else if (player.vx < 0) player.x = s.x + s.w;
        player.vx = 0;
      }
    }
    const wasG = player.grounded;
    player.y += player.vy;
    player.grounded = false;
    for (let s of sol) {
      if (hit(player, s)) {
        if (player.vy > 0) {
          if (!wasG && player.vy > 3) { player.scaleX = 1.2; player.scaleY = 0.82; addDust(player.x+player.w/2, s.y, 4); }
          player.y = s.y - player.h; player.vy = 0; player.grounded = true;
        } else if (player.vy < 0) {
          player.y = s.y + s.h; player.vy = 0;
        }
      }
    }
    for (let h of lvl.hazards) {
      if (hit(player, h)) {
        beep(150, 60, 0.2);
        loadLevel(lvlIdx);
        return;
      }
    }
    if (hit(player, lvl.goal)) {
      beep(440, 660, 0.14);
      done.add(lvlIdx);
      loadLevel(lvlIdx + 1);
      return;
    }
  }
  else if (player.state === 'SHATTERED') {
    pieces.forEach(p => {
      if (p.dead) return;
      p.vy += GRAVITY;
      p.x += p.vx;
      for (let s of sol) {
        if (hit(p, s)) {
          if (p.vx > 0) p.x = s.x - p.w;
          else if (p.vx < 0) p.x = s.x + s.w;
          p.vx = -p.vx * 0.35;
        }
      }
      p.y += p.vy;
      for (let s of sol) {
        if (hit(p, s)) {
          if (p.vy > 0) {
            p.y = s.y - p.h; p.vy = -p.vy * 0.22;
            p.vx *= 0.91; p.vrot *= 0.6;
            if (Math.abs(p.vy) < 0.5) p.vy = 0;
          } else if (p.vy < 0) {
            p.y = s.y + s.h; p.vy = 0;
          }
        }
      }
      for (let h of lvl.hazards) {
        if (hit(p, h)) { p.dead = true; break; }
      }
      if (p.y > 500 || p.x < -50 || p.x > 930) p.dead = true;
      p.rot += p.vrot;
    });
    pieces = pieces.filter(p => !p.dead);

    if (pieces.length === 0) {
      loadLevel(lvlIdx);
      return;
    }
    if (!pieces[anchorIdx] || pieces[anchorIdx].dead) {
      anchorIdx = 0;
    }
  }
  else if (player.state === 'REASSEMBLING') {
    player.timer += 0.09;
    const t = Math.min(player.timer, 1);
    const ease = 1 - Math.pow(1-t, 3);
    pieces.forEach(p => {
      const dx = player.tx + player.w/2 + p.ox - p.w/2;
      const dy = player.ty + player.h/2 + p.oy - p.h/2;
      p.x = p.sx + (dx - p.sx) * ease;
      p.y = p.sy + (dy - p.sy) * ease;
      p.rot *= (1-t);
    });
    if (t >= 1) {
      player.x = player.tx; player.y = player.ty;
      if (lvlIdx === 6 || lvlIdx === 7) player.vy = -4.5;
      else player.vy = 0;
      player.vx = 0;
      player.scaleX = 0.95; player.scaleY = 1.05;
      player.state = 'ASSEMBLED';
      pieces = [];
      addDust(player.x + player.w/2, player.y + player.h/2, 8);
      beep(320, 480, 0.12, 0.05);
    }
  }

  dust.forEach(d => { d.x += d.vx; d.y += d.vy; d.life -= 0.045; });
  dust = dust.filter(d => d.life > 0);
}

function drawEyes(facing) {
  ctx.fillStyle = PAPER;
  const ex = facing >= 0 ? 2 : -2;
  ctx.fillRect(-4+ex, -2, 2.5, 4);
  ctx.fillRect(2+ex, -2, 2.5, 4);
}
function drawPlayerSprite(cx, cy, walk, sx, sy, facing) {
  const swing = Math.sin(walk) * 3.5;
  ctx.save();
  ctx.translate(cx, cy+27); ctx.scale(sx, sy); ctx.translate(0, -27);
  PARTS.forEach(p => {
    let ay = 0;
    if (p.limb==='legL') ay = swing;
    if (p.limb==='legR') ay = -swing;
    if (p.limb==='armL') ay = -swing*0.6;
    if (p.limb==='armR') ay = swing*0.6;
    if (p.head) ay = -Math.abs(swing)*0.25;
    ctx.save();
    ctx.translate(p.ox, p.oy+ay);
    ctx.fillStyle = INK;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    if (p.head) drawEyes(facing);
    ctx.restore();
  });
  ctx.restore();
}

function drawMenu() {
  ctx.fillStyle = PAPER; ctx.fillRect(0,0,880,460);
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(16,16,848,428);
  ctx.fillStyle = INK; ctx.textAlign='center';
  ctx.font = 'bold 46px ui-monospace, monospace';
  ctx.fillText('BOUNCE BACK', 440, 112);
  const bounce = Math.abs(Math.sin(animFrame*0.05))*8;
  drawPlayerSprite(440, 165-bounce, animFrame*0.08, 1, 1, 1);
  menuButtonsRects = [];
  const bw=240, bh=44, sy=235, gap=58;
  MENU_ITEMS.forEach((label, i) => {
    const bx=440-bw/2, by=sy+i*gap;
    menuButtonsRects.push({x:bx,y:by,w:bw,h:bh});
    const active = i===menuIndex;
    ctx.fillStyle = active ? INK : PAPER;
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle = active ? PAPER : INK;
    ctx.font = 'bold 18px ui-monospace, monospace';
    ctx.fillText(label, 440, by+28);
  });
  ctx.textAlign='left';
}

function drawLevelsScreen() {
  ctx.fillStyle = PAPER; ctx.fillRect(0,0,880,460);
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(16,16,848,428);
  ctx.fillStyle = INK; ctx.textAlign='center';
  ctx.font = 'bold 34px ui-monospace, monospace';
  ctx.fillText('SELECT LEVEL', 440, 85);

  levelButtonsRects = [];
  const bw = 140, bh = 85, gap = 20;
  const startX = 50, startY = 150;
  LEVELS.forEach((level, i) => {
    const col = i % 5, row = Math.floor(i / 5);
    const bx = startX + col * (bw + gap);
    const by = startY + row * (bh + gap);
    levelButtonsRects.push({x:bx, y:by, w:bw, h:bh, idx:i});
    const isDone = done.has(i);
    const isHover = levelHoverIdx === i;
    ctx.fillStyle = isHover ? INK : PAPER;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = isHover ? PAPER : INK;
    ctx.font = 'bold 24px ui-monospace, monospace';
    ctx.fillText(String(i+1).padStart(2,'0'), bx + bw/2, by + 40);
    const name = level.name.split(' // ')[1] || '';
    ctx.font = 'bold 10px ui-monospace, monospace';
    ctx.fillText(name, bx + bw/2, by + 62);
    if (isDone) {
      ctx.font = 'bold 11px ui-monospace, monospace';
      ctx.fillText('CLEARED', bx + bw/2, by + 78);
    }
  });

  const bbx = 340, bby = 380, bbw = 200, bbh = 38;
  backButtonRect = {x:bbx, y:bby, w:bbw, h:bbh};
  ctx.fillStyle = INK;
  ctx.fillRect(bbx, bby, bbw, bbh);
  ctx.fillStyle = PAPER;
  ctx.font = 'bold 15px ui-monospace, monospace';
  ctx.fillText('BACK', 440, bby + 24);
  ctx.textAlign='left';
}

function drawControlsScreen() {
  ctx.fillStyle = PAPER; ctx.fillRect(0,0,880,460);
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(16,16,848,428);
  ctx.fillStyle = INK; ctx.textAlign='center';
  ctx.font = 'bold 34px ui-monospace, monospace';
  ctx.fillText('CONTROLS', 440, 85);
  const rows = [
    ['[A] / [D]', 'Move left / right'],
    ['[W] / [SPACE]', 'Jump'],
    ['[E]', 'Break into pieces / Reassemble'],
    ['[Q] / Click', 'Select anchor piece'],
    ['[R]', 'Restart level'],
    ['[ESC]', 'Back to menu']
  ];
  rows.forEach((r, idx) => {
    const y = 145 + idx*42;
    ctx.textAlign='right'; ctx.font='bold 16px ui-monospace, monospace';
    ctx.fillText(r[0], 420, y);
    ctx.textAlign='left'; ctx.font='16px ui-monospace, monospace';
    ctx.fillText('—  '+r[1], 435, y);
  });
  ctx.fillStyle = INK; ctx.fillRect(340,395,200,38);
  ctx.fillStyle = PAPER; ctx.textAlign='center';
  ctx.font='bold 15px ui-monospace, monospace';
  ctx.fillText('BACK TO MENU', 440, 419);
  ctx.textAlign='left';
}

function drawGame() {
  ctx.fillStyle = PAPER; ctx.fillRect(0,0,880,460);

  const g = lvl.goal;
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.setLineDash([5,5]); ctx.strokeRect(g.x, g.y, g.w, g.h);
  ctx.setLineDash([]);
  ctx.fillStyle = INK; ctx.fillRect(g.x+g.w/2-3, g.y+g.h/2-3, 6, 6);

  ctx.fillStyle = INK;
  lvl.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

  lvl.buttons.forEach(b => {
    if (b.pressed) {
      ctx.fillStyle = '#555';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = INK;
      ctx.fillRect(b.x+4, b.y+4, b.w-8, 4);
    } else {
      ctx.fillStyle = INK;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  });

  lvl.doors.forEach(d => {
    ctx.fillStyle = PAPER;
    ctx.fillRect(d.x, d.currY, d.w, d.h);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.strokeRect(d.x, d.currY, d.w, d.h);
    ctx.beginPath();
    ctx.moveTo(d.x, d.currY);
    ctx.lineTo(d.x+d.w, d.currY+d.h);
    ctx.stroke();
  });

  ctx.fillStyle = INK;
  lvl.hazards.forEach(h => {
    for (let x = h.x; x < h.x+h.w; x += 14) {
      ctx.beginPath();
      ctx.moveTo(x, h.y+h.h);
      ctx.lineTo(x+7, h.y);
      ctx.lineTo(x+14, h.y+h.h);
      ctx.fill();
    }
  });

  if (player.state === 'ASSEMBLED') {
    drawPlayerSprite(player.x+player.w/2, player.y+player.h/2, player.walk, player.scaleX, player.scaleY, player.facing);
  } else {
    const a = pieces[anchorIdx];
    if (a && !a.dead) {
      const ax = a.x+a.w/2, ay = a.y+a.h/2;
      ctx.strokeStyle = 'rgba(23,23,23,0.25)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3,4]);
      pieces.forEach((p,i) => {
        if (i===anchorIdx || p.dead) return;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(p.x+p.w/2, p.y+p.h/2); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    pieces.forEach((p,i) => {
      if (p.dead) return;
      ctx.save();
      ctx.translate(p.x+p.w/2, p.y+p.h/2);
      ctx.rotate(p.rot);
      if (i === anchorIdx) {
        ctx.fillStyle = PAPER;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.fillStyle = INK;
        if (p.head) { ctx.fillRect(-4,-2,2.5,4); ctx.fillRect(2,-2,2.5,4); }
        else ctx.fillRect(-2.5,-2.5,5,5);
      } else {
        ctx.fillStyle = INK;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        if (p.head) drawEyes(player.facing);
      }
      ctx.restore();
    });
  }

  ctx.fillStyle = INK;
  dust.forEach(d => {
    ctx.globalAlpha = d.life * 0.6;
    ctx.fillRect(d.x-d.s/2, d.y-d.s/2, d.s, d.s);
  });
  ctx.globalAlpha = 1;
}

function loop() {
  animFrame++;
  if (screen === 'MENU') drawMenu();
  else if (screen === 'LEVELS') drawLevelsScreen();
  else if (screen === 'CONTROLS') drawControlsScreen();
  else { updateGame(); drawGame(); }
  requestAnimationFrame(loop);
}

openMenu();
loop();
</script>
</body>
</html>
